# =============================================================================
# Jeu de questions de référence (benchmark) — corpus fictif Orizia Banque
# -----------------------------------------------------------------------------
# Méthode de construction : questions rédigées manuellement après l'écriture du
# corpus, en couvrant 10 catégories de difficulté. Pour chaque question :
#   gold_docs        : documents justificatifs avec un niveau de pertinence
#                      (2 = indispensable, 1 = utile). Sert à Recall@k, MRR, nDCG@k.
#   evidence         : faits justificatifs (chaînes courtes) qui doivent apparaître
#                      dans le contexte récupéré (inspiré des "supporting facts"
#                      de HotpotQA).
#   answer_keywords  : groupes d'alternatives ; chaque groupe doit être présent
#                      dans la réponse pour qu'elle soit jugée exacte.
#   forbidden        : chaînes qui ne doivent PAS apparaître dans la réponse.
#   expected_abstain : le système doit refuser de répondre (information absente
#                      ou non autorisée pour l'utilisateur).
#   expect_conflict  : le système doit signaler des sources divergentes.
#   expect_ambiguity : le système doit signaler l'ambiguïté de la question.
#   user             : identité utilisée pour la question (contrôle d'accès).
# Limites : 66 questions rédigées par l'auteur du corpus (biais de conception
# possible) ; échantillon trop petit pour des conclusions statistiques fortes.
# =============================================================================

defaults:
  user: admin
  expected_abstain: false
  expect_conflict: false
  expect_ambiguity: false

