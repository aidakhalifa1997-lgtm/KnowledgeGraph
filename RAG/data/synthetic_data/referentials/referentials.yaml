# Alias ambigus : une même forme de surface désigne plusieurs entités.
# Le résolveur choisit à l'aide d'indices de contexte (mots proches) ; sans indice
# suffisant, la mention est conservée comme ambiguë et n'est pas reliée.
ambiguous_aliases:
  - surface: Sentinel
    candidates:
      - {id: prj:sentinel, cues: [projet, comité de pilotage, chef de projet, cheffe de projet, lot, jalon, sponsor]}
      - {id: sys:sentinel-kyc, cues: [plateforme, outil, application, saisie, écran, module, interface, système]}
  - surface: Horizon
    candidates:
      - {id: prj:horizon-data, cues: [programme, projet, jalon, sponsor, lot, feuille de route]}
      - {id: sys:datalake-horizon, cues: [plateforme, lakehouse, données, ingestion, stockage, cluster, système]}
