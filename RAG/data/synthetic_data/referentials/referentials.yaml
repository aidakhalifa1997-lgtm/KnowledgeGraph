# =============================================================================
# Référentiels maîtres de l'entreprise FICTIVE « Orizia Banque »
# -----------------------------------------------------------------------------
# Rôle : catalogue d'entités canoniques (identifiant + nom + alias) utilisé pour la
# résolution d'entités. Dans une banque réelle, ces données proviendraient de
# l'annuaire RH, de la cartographie applicative (CMDB), du portefeuille projets
# et du catalogue de procédures.
#
# IMPORTANT : ces référentiels ne contiennent AUCUNE relation entre entités
# (pas d'appartenance, pas de rôle, pas d'expertise). Les relations du graphe
# proviennent exclusivement des documents. Seule exception, explicitement marquée
# `source=referential` dans le graphe : la taxonomie des domaines (concept ->
# domaine, procédure/projet -> domaine), qui relève de la gouvernance documentaire.
#
# Toutes les personnes, entités et applications sont fictives.
# =============================================================================

