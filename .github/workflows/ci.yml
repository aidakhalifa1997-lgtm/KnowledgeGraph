# Intégration continue de la plateforme (code dans RAG/CODE).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint et tests unitaires
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: RAG/CODE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: RAG/CODE/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -m "not integration" -q

  integration:
    name: Backend — tests d'intégration (Neo4j)
    runs-on: ubuntu-24.04
    needs: backend
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password-only
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: RAG/CODE
    env:
      # Base jetable propre à la CI : les tests d'intégration la vident entièrement.
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_TEST_PASSWORD: ci-test-password-only
    steps:
      - uses: actions/checkout@v4
      - name: Tesseract (OCR du PDF scanné du corpus)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: RAG/CODE/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -m integration -q

  frontend:
    name: Frontend — types et compilation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: RAG/CODE/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: RAG/CODE/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  security:
    name: Sécurité — dépendances et secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnérabilités connues des dépendances Python
        run: pip install pip-audit && pip-audit -r RAG/CODE/requirements.txt
      - name: Vulnérabilités connues des dépendances npm (production)
        working-directory: RAG/CODE/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Recherche de secrets dans l'historique Git
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --no-banner --redact --config /repo/.gitleaks.toml

  docker:
    name: Images Docker
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construction des images
        working-directory: RAG
        run: |
          cp .env.example .env
          docker compose build
